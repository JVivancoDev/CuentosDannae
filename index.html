<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuentitos Mágicos</title>
<meta name="theme-color" content="#FFF8EC">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<section id="biblioteca" class="vista">
  <header class="cabecera">
    <span class="luna" aria-hidden="true">🌙</span>
    <h1>Cuentitos Mágicos</h1>
    <p class="bienvenida">¡Hola, pequeña soñadora! ¿Qué historia leeremos hoy?</p>
  </header>
  <main class="contenedor">
    <input id="buscador" type="search" placeholder="🔍 Buscar un cuento por título" aria-label="Buscar cuento">
    <nav id="filtros" class="filtros" aria-label="Categorías"></nav>
    <section id="seccion-destacados">
      <h2>⭐ Cuentos destacados</h2>
      <div id="destacados" class="destacados"></div>
    </section>
    <section>
      <h2 id="titulo-lista">Todos los cuentos</h2>
      <div id="cuadricula" class="cuadricula"></div>
      <p id="vacio" class="vacio" hidden></p>
    </section>
  </main>
</section>

<section id="lector" class="vista" hidden>
  <div class="progreso"><div id="barra"></div></div>
  <div class="barra-lector">
    <button id="volver" class="btn" aria-label="Volver a la biblioteca">← Volver</button>
    <div class="controles">
      <button id="menos" class="btn redondo" aria-label="Letra más pequeña">A−</button>
      <button id="mas" class="btn redondo" aria-label="Letra más grande">A+</button>
      <button id="noche" class="btn redondo" aria-label="Modo nocturno">🌙</button>
      <button id="fav" class="btn redondo" aria-label="Favorito" aria-pressed="false">🤍</button>
    </div>
  </div>
  <article class="historia">
    <div id="portada" class="portada" aria-hidden="true"></div>
    <h1 id="lector-titulo"></h1>
    <div id="lector-texto"></div>
    <p class="fin">✨ Fin ✨</p>
  </article>
</section>
<script src="js/cuentos.js"></script>
<script src="js/app.js"></script>
</body>
</html>
